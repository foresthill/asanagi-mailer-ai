<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Asanagi</title>
<style>
  :root { color-scheme: light dark; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid; place-items: center;
    background: #f7f7f8; color: #1a1a1e;
    font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", Meiryo, sans-serif;
  }
  @media (prefers-color-scheme: dark) { body { background: #0c0c0f; color: #ececf1; } }
  .box { display: flex; flex-direction: column; align-items: center; gap: 18px; }
  .glyph {
    width: 64px; height: 64px; border-radius: 18px;
    background: linear-gradient(150deg, #0e7c8b, #0891b2);
    display: grid; place-items: center; color: #fff; font-weight: 900; font-size: 30px;
    box-shadow: 0 10px 30px rgba(8,145,178,.25);
  }
  .name { font-size: 15px; font-weight: 700; letter-spacing: .02em; }
  .sub { font-size: 12px; opacity: .6; }
  .spin { width: 22px; height: 22px; border: 2px solid currentColor; border-top-color: transparent;
    border-radius: 50%; opacity: .5; animation: r 0.8s linear infinite; }
  @keyframes r { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spin { animation: none; } }
</style>
</head>
<body>
  <div class="box">
    <div class="glyph">凪</div>
    <div class="name">Asanagi 朝凪</div>
    <div class="spin"></div>
    <div class="sub">ローカルサーバを起動しています…</div>
  </div>
</body>
</html>
