name: Desktop build

# デスクトップアプリを CI でビルドし、Release に添付する。
# Linux（AppImage/.deb/.rpm）と macOS（.dmg/.app）を同じリリースに出す。
# Windows は Node 同梱（node.exe）＋ランチャーの対応が要るため別途。
# 起動: タグ push（例 `app-v0.1.0`）または Actions 画面の「Run workflow」。
on:
  workflow_dispatch:
  push:
    tags:
      - "app-v*"

permissions:
  contents: write # Release 作成・アップロードに必要

jobs:
  build:
    strategy:
      # 片方の OS が失敗しても、もう片方の成果物は出す。
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04 # Linux: deb / rpm / AppImage（glibc 2.35）
            args: ""
          - platform: macos-latest # macOS: dmg / app（Apple Silicon = arm64）
            args: ""
          - platform: windows-latest # Windows: NSIS .exe インストーラ（WiX不要）
            args: "--bundles nsis"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build deps (Tauri v2)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            build-essential \
            libfuse2 \
            file

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install JS deps
        # npm ci はロックの厳密一致を要求（optional依存の欠けで失敗するため）
        # ビルド用途では reconcile する npm install を使う。
        run: npm install --no-audit --no-fund

      # Bundle the Node runtime so the end user needs nothing installed.
      # We reuse the runner's Node 24 (official build from setup-node), shipped as
      # the app resource (tauri.conf.json bundle.resources: "binaries/node*").
      # Linux=linux-x64(glibc), macOS=該当アーキ(arm64), Windows=win-x64(node.exe)。
      # process.execPath を使い OS に関係なく確実にコピーする（Windows の .exe も）。
      - name: Bundle Node runtime
        shell: bash
        run: |
          node -e "const fs=require('fs');fs.mkdirSync('src-tauri/binaries',{recursive:true});const dest=process.platform==='win32'?'node.exe':'node';fs.copyFileSync(process.execPath,'src-tauri/binaries/'+dest);console.log('bundled',process.execPath,'->',dest)"
          if [[ "${{ matrix.platform }}" == macos* ]]; then
            chmod +x src-tauri/binaries/node
            # macOS(Apple Silicon)は署名が無いと「壊れている」と表示される。同梱 node を
            # アドホック署名し、アプリ側の署名(signingIdentity:"-")と整合させる。
            codesign --force --sign - src-tauri/binaries/node
            codesign -dv src-tauri/binaries/node || true
          elif [[ "${{ matrix.platform }}" == ubuntu* ]]; then
            chmod +x src-tauri/binaries/node
          fi

      # tauri build が conf の beforeBuildCommand(build:standalone)を実行し、
      # .next-standalone を bundle.resources として同梱する。bundle.targets="all"
      # なので各OSのネイティブ形式（Linux=deb/rpm/appimage, macOS=dmg/app）を作る。
      - name: Build desktop bundle + publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 自動アップデート用の署名鍵（GitHub Secrets）。設定されていれば更新成果物を
          # 署名し latest.json を Release に添付する。未設定なら署名はスキップされる。
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # GitHub runner は FUSE が使えず linuxdeploy(AppImage)が失敗するため、
          # AppImage を extract して実行させる（Linux のみ効く・他OSでは無害）。
          APPIMAGE_EXTRACT_AND_RUN: "1"
          NO_STRIP: "1"
        with:
          # Windows は WiX(.msi) を避け NSIS(.exe) のみ。Linux/macOS は既定("")。
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || format('app-v0.0.0-dev-{0}', github.run_number) }}
          releaseName: "Asanagi Desktop ${{ github.ref_type == 'tag' && github.ref_name || 'dev build' }}"
          releaseBody: |
            デスクトップビルド: Linux（AppImage / .deb / .rpm）＋ macOS（.dmg）＋ Windows（.exe/NSIS）。
            Node ランタイムを同梱済みのため、実行マシンへの Node インストールは不要です。
            macOS は未署名のため初回は「開発元を確認できません」→ 右クリック→「開く」で起動してください（Apple Silicon 向け）。
            Windows も未署名のため「WindowsによってPCが保護されました」→「詳細情報」→「実行」で起動してください。
            初回は Gmail 再認証と AI キー入力が必要。自動アップデート対応（mac/Windows/AppImage）。
          releaseDraft: false
          # 自動アップデートは `releases/latest` を参照する。app-v* をプレリリースに
          # すると GitHub が別系列(mcp-v*)を Latest 扱いし、更新が見つからなくなるため
          # 正式リリースにする（最新の app-v* が Latest になり latest.json が解決する）。
          prerelease: false
