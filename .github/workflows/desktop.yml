name: Desktop build

# デスクトップアプリを CI でビルドし、Release に添付する。
# Linux（AppImage/.deb/.rpm）と macOS（.dmg/.app）を同じリリースに出す。
# Windows は Node 同梱（node.exe）＋ランチャーの対応が要るため別途。
# 起動: タグ push（例 `app-v0.1.0`）または Actions 画面の「Run workflow」。
on:
  workflow_dispatch:
  push:
    tags:
      - "app-v*"

permissions:
  contents: write # Release 作成・アップロードに必要

jobs:
  build:
    strategy:
      # 片方の OS が失敗しても、もう片方の成果物は出す。
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04 # Linux: deb / rpm / AppImage（glibc 2.35）
            args: ""
          - platform: macos-latest # macOS: dmg / app（Apple Silicon = arm64）
            args: ""
          - platform: windows-latest # Windows: NSIS .exe インストーラ（WiX不要）
            args: "--bundles nsis"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build deps (Tauri v2)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            build-essential \
            libfuse2 \
            file

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install JS deps
        # npm ci はロックの厳密一致を要求（optional依存の欠けで失敗するため）
        # ビルド用途では reconcile する npm install を使う。
        run: npm install --no-audit --no-fund

      # Bundle the Node runtime so the end user needs nothing installed.
      # We reuse the runner's Node 24 (official build from setup-node), shipped as
      # the app resource (tauri.conf.json bundle.resources: "binaries/node*").
      # Linux=linux-x64(glibc), macOS=該当アーキ(arm64), Windows=win-x64(node.exe)。
      # process.execPath を使い OS に関係なく確実にコピーする（Windows の .exe も）。
      - name: Bundle Node runtime
        shell: bash
        run: |
          node -e "const fs=require('fs');fs.mkdirSync('src-tauri/binaries',{recursive:true});const dest=process.platform==='win32'?'node.exe':'node';fs.copyFileSync(process.execPath,'src-tauri/binaries/'+dest);console.log('bundled',process.execPath,'->',dest)"
          if [[ "${{ matrix.platform }}" == macos* ]]; then
            chmod +x src-tauri/binaries/node
            # macOS(Apple Silicon)は署名が無いと「壊れている」と表示される。まず同梱 node を
            # アドホック署名（最低限の保険）。Apple Secrets が揃う本番では beforeBuildCommand の
            # sign-mac-sidecar.sh が Dev ID で再署名し公証可能にする（アドホックは上書きされる）。
            # Secrets 欠落時（fork 等）は再署名がskipされ、このアドホック署名が残って起動はできる。
            codesign --force --sign - src-tauri/binaries/node
            codesign -dv src-tauri/binaries/node || true
          elif [[ "${{ matrix.platform }}" == ubuntu* ]]; then
            chmod +x src-tauri/binaries/node
          fi

      # macOS: Developer ID 証明書を beforeBuildCommand より前にキーチェーンへ取り込む。
      # tauri-action は証明書をバンドル署名の直前(=beforeBuildCommand の後)に取り込むため、
      # beforeBuildCommand で走る sign-mac-sidecar.sh が証明書を見つけられず同梱 node の
      # Dev ID 再署名をスキップ→node がアドホック(タイムスタンプ/hardened runtime 無し)の
      # まま公証で "signature does not include a secure timestamp" /
      # "does not have the hardened runtime enabled" で弾かれていた。先に取り込むことで
      # sign-mac-sidecar が node を正しく再署名できる。tauri-action には APPLE_CERTIFICATE を
      # 渡さず、このキーチェーンの identity をそのまま使わせる（二重取り込みで identity が
      # 曖昧化するのを避ける）。
      - name: Import Developer ID into keychain (macOS, before build)
        if: ${{ startsWith(matrix.platform, 'macos') && secrets.APPLE_CERTIFICATE != '' }}
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      # tauri build が conf の beforeBuildCommand(build:standalone)を実行し、
      # .next-standalone を bundle.resources として同梱する。bundle.targets="all"
      # なので各OSのネイティブ形式（Linux=deb/rpm/appimage, macOS=dmg/app）を作る。
      - name: Build desktop bundle + publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 自動アップデート用の署名鍵（GitHub Secrets）。設定されていれば更新成果物を
          # 署名し latest.json を Release に添付する。未設定なら署名はスキップされる。
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS コード署名＋公証。証明書の取り込みは直前の "Import Developer ID" ステップで
          # 済ませてある（beforeBuildCommand の sign-mac-sidecar が node を再署名できるように）。
          # ここでは identity の指定と公証資格情報だけ渡す。APPLE_CERTIFICATE を渡さないのは、
          # tauri-action が別キーチェーンに二重取り込みして identity が曖昧化するのを避けるため。
          # Linux/Windows runner では無視される。ref: https://v2.tauri.app/distribute/sign/macos/
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # GitHub runner は FUSE が使えず linuxdeploy(AppImage)が失敗するため、
          # AppImage を extract して実行させる（Linux のみ効く・他OSでは無害）。
          APPIMAGE_EXTRACT_AND_RUN: "1"
          NO_STRIP: "1"
        with:
          # Windows は WiX(.msi) を避け NSIS(.exe) のみ。Linux/macOS は既定("")。
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || format('app-v0.0.0-dev-{0}', github.run_number) }}
          releaseName: "Asanagi Desktop ${{ github.ref_type == 'tag' && github.ref_name || 'dev build' }}"
          releaseBody: |
            デスクトップビルド: Linux（AppImage / .deb / .rpm）＋ macOS（.dmg）＋ Windows（.exe/NSIS）。
            Node ランタイムを同梱済みのため、実行マシンへの Node インストールは不要です。
            macOS（Apple Silicon）は Developer ID 署名＋Apple 公証済み。通常はダブルクリックで起動できます。
            Windows は未署名のため「WindowsによってPCが保護されました」→「詳細情報」→「実行」で起動してください。
            初回は Gmail 再認証と AI キー入力が必要。自動アップデート対応（mac/Windows/AppImage）。
          releaseDraft: false
          # 自動アップデートは `releases/latest` を参照する。app-v* をプレリリースに
          # すると GitHub が別系列(mcp-v*)を Latest 扱いし、更新が見つからなくなるため
          # 正式リリースにする（最新の app-v* が Latest になり latest.json が解決する）。
          prerelease: false
