name: Desktop build (Linux)

# CTO向けに Linux アプリ(AppImage/.deb)を CI でビルドし、Release に添付する。
# macOS からは Linux バンドルを作れないため CI が最短。
# 起動: タグ push（例 `app-v0.1.0`）または Actions 画面の「Run workflow」。
on:
  workflow_dispatch:
  push:
    tags:
      - "app-v*"

permissions:
  contents: write # Release 作成・アップロードに必要

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build deps (Tauri v2)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            build-essential \
            libfuse2 \
            file

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install JS deps
        # npm ci はロックの厳密一致を要求（optional依存の欠けで失敗するため）
        # ビルド用途では reconcile する npm install を使う。
        run: npm install --no-audit --no-fund

      # Bundle the Node runtime so the end user needs nothing installed.
      # We reuse the runner's Node 24 (official linux-x64 build from setup-node),
      # shipped as the app resource `node` (see tauri.conf.json bundle.resources).
      - name: Bundle Node runtime
        run: |
          mkdir -p src-tauri/binaries
          cp "$(command -v node)" src-tauri/binaries/node
          chmod +x src-tauri/binaries/node
          echo "bundled node: $(src-tauri/binaries/node --version)"
          ls -lh src-tauri/binaries/node

      # tauri build が conf の beforeBuildCommand(build:standalone)を実行し、
      # .next-standalone を bundle.resources として同梱する。
      - name: Build desktop bundle + publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GitHub runner は FUSE が使えず linuxdeploy(AppImage)が失敗するため、
          # AppImage を extract して実行させる（AppImageビルドの定番回避）。
          APPIMAGE_EXTRACT_AND_RUN: "1"
          NO_STRIP: "1"
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || format('app-v0.0.0-dev-{0}', github.run_number) }}
          releaseName: "Asanagi Desktop ${{ github.ref_type == 'tag' && github.ref_name || 'dev build' }}"
          releaseBody: |
            Linux デスクトップビルド（AppImage / .deb / .rpm）。
            Node ランタイムを同梱済みのため、実行マシンへの Node インストールは不要です。
            初回は Gmail 再認証と AI キー入力が必要。
            自動アップデートは未設定（署名鍵の設定後に有効化・docs/DESKTOP.md 参照）。
          releaseDraft: false
          prerelease: true
